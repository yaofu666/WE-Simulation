      #      - type: RectilinearBinMapper
      #        boundaries: 
      #          - [0.0, 3.0, 32.0, 91.0, inf]   # basis states pcoord (distance) is within [32,91]
      #    states:
      #      - label: bound     #target state index 0
      #        coords: 
      #          - [2.9]
      #      - label: unbound    #basis state index 1
      #        coords: 
